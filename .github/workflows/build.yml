name: Build Nova X
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake python3
      - name: Build
        run: |
          chmod +x build.sh
          ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }} ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nova-x
          path: out/*.so
